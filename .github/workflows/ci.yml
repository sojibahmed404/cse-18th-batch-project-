name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ─── Backend Lint & Test ─────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: cse18_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test_password@localhost:3306/cse18_portal_test
        run: npm run db:generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test_password@localhost:3306/cse18_portal_test
        run: npx prisma migrate deploy

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: TypeScript type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test_password@localhost:3306/cse18_portal_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_characters_long
          NODE_ENV: test
        run: npm test

      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test_password@localhost:3306/cse18_portal_test
        run: npm run build

  # ─── Frontend Lint & Build ───────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.com/api/v1
        run: npm run build

  # ─── Docker Build (on main push only) ────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: cse18-portal-backend:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: cse18-portal-frontend:latest
